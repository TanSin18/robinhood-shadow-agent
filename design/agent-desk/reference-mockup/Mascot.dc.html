</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["owl","beagle","beaver","raccoon","turtle","parrot"],"default":"owl"},"size":{"editor":"int","min":24,"max":320,"default":160},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'owl';
    const size = this.props.size ?? 160;
    return { size, px: size + 'px', isOwl: k === 'owl', isBeagle: k === 'beagle', isBeaver: k === 'beaver', isRaccoon: k === 'raccoon', isTurtle: k === 'turtle', isParrot: k === 'parrot' };
  }
}
</script>
</body>
</html>
