[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-ai-shadow-agent"
version = "0.1.0"
description = "Stage 1 shadow-mode Robinhood AI trading research and evaluation harness"
requires-python = ">=3.12"
dependencies = [
  "exchange-calendars==4.13.2",
  "keyring>=25,<26",
  "jsonschema>=4,<5",
  "mcp>=2.2,<3",
  "openai-agents>=0.4,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
observability = [
  "arize-phoenix>=20,<21",
  "mlflow>=3,<4",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:The ``noload`` loader strategy is deprecated.*:DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["agents*", "broker*", "broker_proxy*", "config*", "data*", "eval*", "prompts*", "risk*", "scripts*", "research*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
