cost:
  currency: USD
  ai_gate_false_required_cost: 0.00
  official_run_llm_ceiling: 0.40
  official_daily_llm_ceiling: 0.40
  annual_official_api_cost_target_less_than_usd_per_lane: 20.00
  annual_official_api_cost_enforcement_value_usd_per_lane: 19.80
  annual_pacing_per_lane:
    monthly_allowance_usd: 1.65
    credit_time: first_official_cycle_of_each_calendar_month
    starts_with_first_active_calendar_month: true
    unused_allowance_carries_forward_within_calendar_year: true
    maximum_accumulated_carried_allowance_usd: 5.00
    maximum_available_immediately_after_monthly_credit_usd: 6.65
    month_open_available_formula: >-
      min(5.00, prior_month_closing_unused_allowance_usd) + 1.65
    future_month_borrowing_allowed: false
    unused_allowance_expires_on_january_1: true
    maximum_full_year_released_allowance_usd: 19.80
    preflight_formula: >-
      projected_call_cost <= current_month_available_allowance_usd and
      projected_call_cost <= 19.80 - actual_calendar_year_spend_usd
    released_allowance_exhausted_action: HOLD_OPERATIONAL
