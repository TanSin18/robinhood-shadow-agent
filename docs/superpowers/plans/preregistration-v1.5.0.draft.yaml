    minimum_calendar_days: 183
    minimum_completed_trades: 30
    require_calibration_gate: true
    require_positive_after_cost_performance: true
    maximum_drawdown_fraction: 0.10
  champion_challenger:
    require_same_official_snapshots: true
    require_after_cost_beats_champion: true
    require_after_cost_beats_deterministic_no_ai: true
    paired_bootstrap_runs: 10000
