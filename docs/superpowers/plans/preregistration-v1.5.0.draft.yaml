      maximum_input_tokens: 24000
      maximum_output_tokens_including_reasoning: 6000
      reasoning_effort: low
      estimated_maximum_cost_usd: 0.0123
    portfolio:
      maximum_input_tokens: 12000
      maximum_output_tokens_including_reasoning: 3000
      reasoning_effort: medium
