schema_version: 1
registration:
  id: intelligent-agentic-investment-organization
  version: 1.5.0
  registered_on: '2026-09-29'
  effective_from: NOT_EFFECTIVE_PENDING_OPERATOR_APPROVAL
  status: operator_approved_draft_not_active
  authority: operator_only
  purpose: >-
    Freeze the official shadow experiment before its first governed run so that
    agent value, costs, risk, and promotion decisions remain reproducible.
  change_control:
    dashboard_writable: false
    require_operator_approval: true
    require_new_semantic_version: true
    require_effective_date: true
    require_plain_language_reason: true
    retain_prior_version_in_git: true
    label_cross_version_scoreboard_comparisons: true
  change_history:
    - version: 1.5.0
      date: '2026-09-29'
      reason: Operator-approved draft portfolio-first accounting, explicit orchestration, cost attribution and bounded pulse; not effective.
      requested_by: operator
      approval_status: operator_approved_draft_2026_09_29_not_active
    - version: 1.0.0
      date: '2026-09-28'
      reason: Initial preregistration for the gated Phase 0 through Phase 2 architecture.
      requested_by: operator
      approval_status: superseded_unapproved_draft
    - version: 1.1.0
      date: '2026-09-28'
      reason: >-
        Add conditional AI invocation and annual cost targets, separate agent
        selection from code timing and sizing, normalize corporate actions,
        add automatic breakers, link what-if runs, define capital viability,
        document the OAuth fallback, name the historical constituent source,
        and make earnings and filing tilts reduction-only.
      requested_by: operator
      approval_status: superseded_unapproved_draft
    - version: 1.2.0
      date: '2026-09-28'
      reason: >-
        Score every researched candidate on a frozen forward outcome, blind
        Research to screener order and score, register probability targets and
        a twelve-month AI stop rule, require dated model snapshots, expire
        approval cards at market close and price fills from fresh approval-time
        quotes, benchmark Lane B against its exposure-equivalent underlying,
        and simplify operations to SQLite, one dashboard, and a weekly summary.
      requested_by: operator
      approval_status: superseded_unapproved_draft
    - version: 1.3.0
      date: '2026-09-28'
      reason: >-
        Correct the paper-entry limit, score every Critic disposition through
        an isolated shadow ledger, remove the drawdown recovery deadlock,
        shrink uncalibrated probabilities for net edge, register baseline-arm
        probabilities and a stricter twelve-month continuation rule, validate
        inference parameters, pace annual spend monthly, fix Research at a
        20-session horizon initially, and narrow Phase 0 corporate actions.
      requested_by: operator
      approval_status: superseded_unapproved_draft
    - version: 1.4.0
      date: '2026-09-28'
      reason: >-
        Limit baseline bypass to the probability-based net-edge gate while
        retaining every deterministic safety and friction gate, register one
        shared baseline exit rule, replace temperature with low/medium/medium
        reasoning effort and token-priced reservations, resolve unusable shadow
        selections as VOID_DATA with monitoring, and cap accumulated carry at
        $5 per lane.
      requested_by: operator
      approval_status: superseded_by_operator_risk_acceptance
    - version: 1.4.1
      date: '2026-09-28'
      reason: >-
        Replace the full-scope zero-cash fallback with an operator-approved
        $1,200 bounded-cash fallback, isolate Robinhood OAuth and MCP access in
        a minimal read-only local proxy running as a dedicated non-admin macOS
        user with its own Keychain, classify benign cash increases separately
        from latching broker-state changes, monitor authorization expiry, and
        require a proven revoke and re-authorization runbook before the Phase 0
        gate can pass. This pre-effective amendment was explicitly approved by
        the operator before the first governed official run and is retained in
        Git history.
      requested_by: operator
      approval_status: approved_for_phase_0

    - version: 1.4.2
      date: '2026-09-28'
      reason: >-
        Operator-approved pre-effective Phase 0 amendment authorizing exactly
        eleven reads with immutable pinned input schemas. The three order-history
        reads previously listed in v1.4.1 are authorized by this amendment only.
        History is confined to deterministic tripwire and connection-health code,
        excluded from model prompts and shared evidence, and summarized in the UI.
        Preserve the $1,200 cap and every Phase 0 restriction; no Phase 1 authority.
      requested_by: operator
      approval_status: approved_for_phase_0

approval:
  scope: phase_0_only
  approved_on: '2026-09-28'
  approved_by: operator
  phase_1_allowed: false
  note: >-
    Operator approval authorizes Phase 0 implementation and proof only. Phase 1
    remains blocked until the Phase 0 gate passes and preregistration v1.5.0 is
    separately approved.

safety:
  stage: 1
  broker_mode: paper_only
  real_broker_writes_enabled: false
  default_deny_external_actions: true
  shadow_kelly_execution_connected: false
  oauth:
    preferred_path: provider_read_only_scope
    allowed_fallback_path: full_scope_bounded_cash_fallback
    granted_scope_names_must_be_recorded: true
    phase_0_proof_must_name_actual_path: true
    credential_isolation:
      token_owner: dedicated_macos_proxy_user
      proxy_user_short_name: robinhoodproxy
      proxy_user_must_be_non_admin: true
      proxy_user_keychain_only: true
      token_storage: dedicated_proxy_user_macos_keychain
      main_process_receives_token: false
      agent_processes_receive_token: false
      main_process_keychain_access_allowed: false
      transport: unix_domain_socket
      socket_group: robinhoodreaders
      socket_parent_directory_permissions_octal: '0770'
      socket_permissions_octal: '0660'
      main_user_access_via_shared_group_only: true
      peer_uid_must_equal_registered_operator_uid: true
      reject_every_other_peer_uid: true
      callable_methods_exactly_match_allowed_read_tools: true
      write_capable_client_code_present_in_proxy: false
    bounded_cash:
      max_agentic_cash_usd: 1200.00
      operator_set: true
      required_equalities:
        - buying_power_usd == unleveraged_buying_power_usd
        - unleveraged_buying_power_usd == cash_usd
      require_finite_nonnegative_values: true
      outside_bounds_action: HOLD_OPERATIONAL
      outside_bounds_reason: AGENTIC_ACCOUNT_OUTSIDE_BOUNDS
    state_tripwire:
      compare_each_cycle:
        - agentic_cash
        - agentic_positions
        - equity_orders
        - option_orders
        - crypto_orders
      first_verified_snapshot_becomes_baseline: true
      classifications:
        benign_cash_increase:
          reason: ACCOUNT_CASH_INCREASE_BENIGN
          predicates:
            - cash_increased
            - positions_unchanged
            - orders_and_activity_unchanged
            - cash_at_or_below_max_agentic_cash_usd
          actions:
            - log
            - include_in_weekly_summary
          pushover_page: false
          engage_global_kill_switch: false
          becomes_verified_baseline: true
        critical_change:
          predicates_any:
            - cash_decreased
            - any_position_change
            - any_new_or_changed_order_or_activity
            - cash_above_max_agentic_cash_usd
          reason: AGENTIC_ACCOUNT_UNACKNOWLEDGED_CHANGE
          actions:
            - pushover_page
            - engage_global_kill_switch
            - show_revoke_access_instructions
      acknowledgement_required_for_critical_change: true
      rearm_requires_operator_acknowledgement: true
      automatic_rearm_allowed: false
    authorization_expiry_monitor:
      stored_at_required: true
      expires_at_derived_from_provider_expires_in: true
      warning_days_before_expiry:
        - 3
        - 1
      warning_delivery: pushover_page
      warning_deduplicated_per_authorization_and_threshold: true
      refresh_failure_pages_immediately: true
      expired_action: HOLD_OPERATIONAL
      expired_reason: AUTH_EXPIRED
    revocation_proof:
      robinhood_side_disconnect_required: true
      local_keychain_deletion_is_not_remote_revocation: true
      phase_0_requires_successful_test_revoke: true
      revoked_credential_read_must_fail: true
      phase_0_requires_successful_reauthorization: true
      reports_may_contain_amounts_or_account_identifiers: false
  allowlist_enforcement_layers:
    - capability_construction
    - exact_rpc_dispatch
    - broker_and_risk_boundary
  allowed_robinhood_read_tools:
    - get_accounts
    - get_portfolio
    - get_equity_positions
    - get_equity_quotes
    - get_equity_historicals
    - get_option_chains
    - get_option_instruments
    - get_option_quotes
    - get_equity_orders
    - get_option_orders
    - get_crypto_orders
  read_schema_manifest:
    path: broker/read_schemas_v1.4.2.json
    sha256: 158c6634d4255b68a2f3312eb2d5edc1f2eb81c66bf894d45a69d6765c77cf1e
    validate_at_load: true
  order_history_boundary:
    purpose: deterministic_account_tripwire_and_connection_health_only
    model_prompt_access: false
    shared_evidence_cache_access: false
    ui_access: redacted_status_summary_only
    account_scope: configured_agentic_account_only
    crypto_mapping: verified_get_accounts_rhs_account_number
    baseline: complete_paginated_scan_once_before_first_verified_checkpoint
    baseline_rationale: >-
      The catalog provides no verified account creation timestamp or complete
      active-order filter. Without a verified checkpoint, a complete Agentic-only
      initial scan is the shortest supported lookback establishing all tracked
      orders. It is monitoring evidence, never a research lookback. Missing data,
      repeated cursors, missing tracked IDs or exceeded bounds fail closed.
    incremental_window: last_successful_checkpoint_minus_60_seconds
    refresh_tracked_ids: all_including_terminal_orders
    detect_changes: hash_complete_order_record_including_price_and_quantity
    maximum_pages_per_class: 20
    maximum_records_total: 1000
    maximum_calls_per_collection: 1060
    checkpoint_advance: only_after_complete_collection_and_tripwire_acceptance
    incomplete_coverage: page_and_latch_operational_hold
  prohibited_action_classes:
    - place_order
    - replace_order
    - cancel_order
    - exercise_option
    - transfer
    - deposit
    - withdrawal
    - account_or_broker_settings_mutation

official_cycle:
  timezone: America/New_York
  target_time_et: '10:00'
  claim_window_end_et: '10:20'
  trading_calendar: US_equities
  one_atomic_claim_per_market_date: true
  holdings_review_before_discovery: true
  mandatory_options_review_when_options_held: true
  manual_official_rerun_allowed: false
  recovery:
    max_attempts: 1
    require_failed_or_stale_prior_claim: true
    shares_official_daily_cost_ceiling: true

run_mode_isolation:
  modes:
    - official
    - what_if
    - replay
  what_if_may_mutate_official_results: false
  replay_may_mutate_official_results: false
  nonofficial_may_issue_cards: false
  nonofficial_may_write_fills: false
  nonofficial_may_write_official_scoreboard: false
  nonofficial_may_write_official_memory: false
  require_separate_database_connection: true
  require_sqlite_authorizer: true
  require_scheduler_created_official_context: true
  what_if_parent_official_run_id:
    required: true
    database_foreign_key: true
    immutable: true
    reject_if_no_eligible_parent: true

data_quality:
  live_quote_max_age_seconds: 60
  require_final_quote_refresh_before_approval: true
  source_hash_algorithm: sha256_canonical_content
  required_source_times:
    - observed_at
    - effective_at
    - fetched_at
  no_lookahead: true
  total_return_prices_required: true
  stale_only_lane_decision: HOLD_OPERATIONAL
  news_disabled_must_be_labeled: true
  corporate_actions:
    permanent_security_id_required: true
    known_as_of_time_only: true
    phase_0_live_scope:
      normalize_before_live_discovery: true
      normalize_before_live_agent_input: true
      covered_cases:
        - split
        - reverse_split
        - ticker_change
    phase_2_scope:
      - historical_split
      - historical_reverse_split
      - cash_merger
      - stock_merger
      - delisting
      - historical_holdings_conversion
      - terminal_value_rules
    before_phase_2_unimplemented_historical_action: exclude_instrument
    before_phase_2_reason: CORPORATE_ACTION_SCOPE_NOT_IMPLEMENTED
    unresolved_action: exclude_instrument
    unresolved_reason: CORPORATE_ACTION_UNRESOLVED
    required_audit_fields:
      - announcement_at
      - effective_at
      - source_id
      - content_hash
      - adjustment_factor
      - pre_normalized_values
      - normalized_values

universe:
  equity_membership: current_constituents_only_until_norgate_validated
  historical_constituent_source:
    provider: Norgate Data
    dataset: S&P 500 Current & Past historical index constituents
    official_reference: https://norgatedata.com/accessibility.php
    status: not_provisioned_or_validated
    require_delisted_security_coverage: true
    require_license_and_access_proof: true
    require_membership_timestamp_and_content_hash: true
    fallback_backtest_label: SURVIVORSHIP-BIASED
    fallback_applies_to_every_backtest: true
    point_in_time_claim_allowed_before_validation: false
  include_reviewed_unlevered_liquid_etfs: true
  exclude_otc: true
  exclude_leveraged_or_inverse: true
  minimum_price_usd: 5.00
  minimum_history_sessions: 253
  minimum_median_20d_dollar_volume_usd: 50000000
  maximum_median_spread_fraction: 0.003
  shortlist_limit: 30
  live_quote_verification_limit: 20
  ai_research_limit: 8
  deterministic_tie_breaker: symbol_ascending

evidence_quality_score:
  scale_min: 0
  scale_max: 100
  components:
    authoritative_source_quality:
      weight: 0.25
    freshness:
      weight: 0.20
    claim_citation_coverage:
      weight: 0.25
    independent_corroboration:
      weight: 0.15
    completeness_and_explicit_uncertainty:
      weight: 0.15
  portfolio_threshold: 75
  computed_by_code: true
  computed_before_portfolio_input: true
  critical_missing_evidence_overrides_score: true
  uncertainty_tags:
    - VERIFIED_RECENT
    - VERIFIED_HISTORICAL
    - STALE_OR_INFERRED
    - MISSING_CRITICAL

hard_failures:
  closed_list: true
  categories:
    - AUTH_PATH_NOT_ALLOWED
    - UNEXPECTED_MCP_CAPABILITY
    - REAL_BROKER_ACTION_REQUESTED
    - STALE_REQUIRED_MARKET_DATA
    - MISSING_CRITICAL_EVIDENCE
    - UNSOURCED_MATERIAL_CLAIM
    - UNVERIFIED_NUMERIC_CLAIM
    - UNDISCLOSED_SCHEDULED_EVENT
    - LIQUIDITY_REQUIREMENT_FAILED
    - PROMPT_INJECTION_SUSPECTED
    - EXIT_PLAN_MISSING
    - SCHEMA_INVALID_AFTER_RETRY
    - ASSIGNED_MODEL_UNAVAILABLE
    - REQUIRED_OPTIONS_FIELD_MISSING
    - RISK_RULE_VIOLATION
    - RUN_MODE_ISOLATION_VIOLATION
    - PREREGISTRATION_INVALID
    - BUDGET_MINIMUM_NOT_AVAILABLE
    - MONTHLY_AI_ALLOWANCE_NOT_AVAILABLE
    - ANNUAL_AI_COST_TARGET_EXCEEDED
    - AGENTIC_ACCOUNT_OUTSIDE_BOUNDS
    - AGENTIC_ACCOUNT_UNACKNOWLEDGED_CHANGE
    - CORPORATE_ACTION_UNRESOLVED
    - CORPORATE_ACTION_SCOPE_NOT_IMPLEMENTED
    - GLOBAL_KILL_SWITCH_ENGAGED
    - LOSS_BREAKER_ACTIVE
  critic_hard_veto_categories:
    - STALE_REQUIRED_MARKET_DATA
    - MISSING_CRITICAL_EVIDENCE
    - UNSOURCED_MATERIAL_CLAIM
    - UNVERIFIED_NUMERIC_CLAIM
    - UNDISCLOSED_SCHEDULED_EVENT
    - LIQUIDITY_REQUIREMENT_FAILED
    - PROMPT_INJECTION_SUSPECTED
    - EXIT_PLAN_MISSING
    - REQUIRED_OPTIONS_FIELD_MISSING
    - RISK_RULE_VIOLATION
    - CORPORATE_ACTION_UNRESOLVED
  critic_advisory_categories:
    - THESIS_ASYMMETRY_WEAK
    - COUNTEREVIDENCE_UNDERWEIGHTED
    - CORRELATION_OR_CONCENTRATION_CONCERN
    - FORECAST_CALIBRATION_WEAK
    - HORIZON_MISMATCH
    - EXIT_PLAN_CONSERVATISM
  hard_veto_operator_override_allowed: false
  advisory_rebuttal_attempts: 0
  unresolved_advisory_action: drop_action

agent_contract:
  ai_invocation_gate:
    default: do_not_invoke
    invoke_if_any:
      - QUALIFIED_AI_ELIGIBLE_CANDIDATE
      - HOLDING_QUALITATIVE_REVIEW_REQUIRED
    qualified_candidate_scope: individual_stock_requiring_qualitative_evidence
    holding_review_triggers:
      - new_material_filing_transcript_or_news
      - disclosed_event
      - scheduled_thesis_review_deadline
    code_only_cases:
      - no_qualified_candidate
      - etf_only_or_macro_only_shortlist
      - unchanged_holdings
      - deterministic_price_time_or_expiry_review_only
    false_gate_model_calls: 0
    false_gate_required_model_cost_usd: 0.00
    invocation_reason_and_ids_must_be_stored: true
    sequential_stage_conditions:
      research: gate_reason_present
      portfolio: at_least_one_research_dossier_passes_schema_citations_eqs_and_hard_failures
      critic: at_least_one_portfolio_ranked_selection
    skipped_stage_status: NOT_NEEDED
    skipped_stage_cost_usd: 0.00
  assigned_models:
    research: gpt-5.4-nano-2026-03-17
    portfolio: gpt-5.4-mini-2026-03-17
    critic: gpt-5.4-2026-03-05
  model_governance:
    dated_ids_only: true
    dated_id_pattern: '.*-[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    aliases_allowed: false
    model_change_requires_preregistration_version_bump: true
    model_change_requires_operator_approval: true
    model_change_creates_scoreboard_version_boundary: true
    exact_model_unavailable_action: fail_visible
  inference_settings:
    api: responses
    official_parameter_reference: >-
      https://developers.openai.com/api/docs/guides/latest-model?model=gpt-5.4
    research:
      reasoning_effort: low
    portfolio:
      reasoning_effort: medium
    critic:
      reasoning_effort: medium
    temperature_parameter_allowed: false
    reject_unregistered_or_model_unsupported_parameters_before_dispatch: true
  research_may_abstain: true
  required_abstention_status: INSUFFICIENT_EVIDENCE
  schema_repair_attempts: 1
  log_each_attempt_separately: true
  model_fallback_allowed: false
  critic_model_must_differ_from_portfolio_model: true
  critic_input_excludes_portfolio_reasoning: true
  critic_packet_constructed_by_code: true
  risk_override_direction: safety_only
  prompt_injection_scan_before_agent_input: true
  failure_pattern_sources:
    - resolved_official_decision_log
    - content_hashed_cited_external_source
  etf_and_macro_signals_deterministic: true
  research_input_blinding:
    randomize_candidate_order: true
    seed_formula: >-
      sha256(registration_id | official_run_id |
      research_packet_content_hash | "research-order")
    store_seed_and_permutation: true
    strip_fields:
      - screener_rank
      - screener_score
    deny_fields_whose_only_purpose_is_rank_disclosure: true
    research_may_receive_screener_rank_or_score: false
  research_candidate_scoring:
    score_every_received_candidate: true
    included_statuses:
      - QUALIFIED
      - REJECTED
      - INSUFFICIENT_EVIDENCE
    primary_target_id: research_sector_alpha_20d_v1
    primary_horizon_sessions: 20
    realized_outcome_formula: >-
      candidate_total_return_after_entry_exit_spread_and_slippage -
      matched_sector_etf_total_return_after_identical_friction
    rank_metric: pairwise_concordance
    pair_score_correct: 1.0
    pair_score_realized_outcome_tie: 0.5
    pair_score_incorrect: 0.0
    equal_weight_per_resolved_batch: true
    minimum_candidates_for_ranking_batch: 2
    one_candidate_batch_outcome_scored_but_no_rank_pair: true
    primary_ai_value_test: >-
      mean_research_pairwise_concordance_strictly_greater_than_mean_screener_pairwise_concordance
    forecast_horizon_gate:
      before_minimum_resolved_forecasts:
        minimum_resolved_forecasts: 50
        required_horizon_sessions: 20
        required_target_id: research_sector_alpha_20d_v1
      after_minimum_resolved_forecasts:
        permitted_horizon_sessions:
          - 5
          - 10
          - 20
          - 60
      invalid_horizon_action: schema_validation_failure
  portfolio_output:
    type: ranked_conviction_list
    required_fields:
      - selection_id
      - lane
      - candidate_id
      - rank
      - direction
      - conviction_score_0_to_100
      - forecast_type
      - target_id
      - forecast_probability
      - time_horizon_days
      - exit_plan
      - evidence_ids
      - reason_code
    allowed_directions:
      - BULLISH
      - BEARISH
      - NEUTRAL
      - EXIT
      - REDUCE
    forbidden_fields:
      - entry_limit
      - entry_price
      - entry_timing
      - quantity
      - quantity_or_fraction
      - position_size
    may_return_empty_ranked_list: true
    empty_list_reason: NO_CONVICTION
  entry_trigger_owner: deterministic_code
  entry_price_and_timing_owner: deterministic_code
  quantity_owner: deterministic_risk_engine
  agent_may_set_price_timing_or_quantity: false
  entry_trigger_registry:
    - trigger_id: fresh_midpoint_not_worse_than_selection_v1
      applies_to: new_long_defined_risk_entries
      earliest_evaluation: after_critic_pass_and_final_fresh_quote
      selection_reference_price: first_fresh_midpoint_after_portfolio_timestamp
      condition_formula: >-
        current_fresh_midpoint <= selection_reference_price *
        (1 + maximum_limit_distance_fraction)
      entry_limit_formula: >-
        fresh_midpoint * (1 + maximum_limit_distance_fraction)
      entry_limit_midpoint_source: fresh_quote_when_trigger_fires_and_card_is_issued
      expires_at_et: min_1530_or_exchange_close_minus_30_minutes
      if_not_fired: no_entry
      code_only_intraday_checks: true

decisions:
  multiple_actions_per_run: true
  action_order:
    - CLOSE
    - REDUCE
    - HOLD_POSITION
    - OPEN
    - ADD
  hold_cash_scope: per_lane
  hold_operational_distinct_from_hold_cash: true
  exits_always_permitted_by_risk_engine: true
  exit_quantity_cannot_exceed_verified_holding: true
  lane_b_block_may_migrate_to_lane_a: false
  persist_separately:
    agent_selection:
      - candidate_id
      - direction
      - rank
      - conviction
      - forecast_probability
      - evidence_ids
      - exit_plan
      - selection_timestamp
    code_timing:
      - trigger_id
      - trigger_version
      - trigger_inputs
      - trigger_timestamp
      - reference_price
      - expiry
      - fired_state

paper_approvals:
  expiry: official_exchange_close_same_market_date
  respect_scheduled_early_close: true
  carry_to_next_market_date: false
  approval_after_expiry_action: reject
  approval_quote_max_age_seconds: 60
  approval_time_fill:
    arithmetic: decimal_base_10
    buy_formula: fresh_ask * (1 + registered_slippage_fraction)
    sell_formula: fresh_bid * (1 - registered_slippage_fraction)
    options_apply_contract_multiplier: true
    code_defined_limit_and_risk_bounds_required: true
    worse_than_code_limit_action: no_fill
    worse_than_code_limit_reason: PRICE_MOVED_BEYOND_LIMIT
    model_participation: none
  required_normal_spread_test_vector:
    fresh_midpoint: '100.00'
    maximum_limit_distance_fraction: '0.005'
    expected_entry_limit: '100.5000'
    approval_bid: '99.90'
    approval_ask: '100.10'
    registered_buy_slippage_fraction: '0.001'
    expected_fill_price: '100.2001'
    expected_result: fill
  immutable_audit_fields:
    - quote_id
    - quote_observed_at
    - approval_at
    - bid
    - ask
    - registered_slippage_fraction
    - fill_formula
    - entry_limit
    - computed_fill_price
    - no_fill_reason

net_edge:
  currency: USD
  expected_gross_pnl_formula: >-
    p_used * target_gain_usd -
    (1 - p_used) * loss_if_wrong_usd
  probability_policy:
    agent_arms:
      calibrated_gate:
        minimum_resolved_forecasts_same_agent_and_target: 50
        require_brier_strictly_better_than_prior_base_rate: true
      before_calibrated_gate:
        p_used_formula: base_rate + 0.5 * (p_agent_raw - base_rate)
      after_calibrated_gate:
        p_used_formula: p_agent_raw
    deterministic_no_ai:
      probability_based_net_edge_gate_applies: false
      hypothetical_p_formula: prior_resolved_base_rate_same_target
      hypothetical_net_edge_must_be_logged: true
    seeded_random:
      probability_based_net_edge_gate_applies: false
      hypothetical_p_formula: prior_resolved_base_rate_same_target
      hypothetical_net_edge_must_be_logged: true
    base_rate_source: prior_resolved_official_samples_same_target_definition
    base_rate_when_no_prior_resolved_samples: 0.5
    current_outcome_may_enter_base_rate: false
    immutable_logged_fields:
      - p_agent_raw
      - p_used
      - hypothetical_p
      - hypothetical_net_edge_usd
      - base_rate
      - prior_resolved_sample_count
      - agent_brier_score
      - base_rate_brier_score
      - shrinkage_rule_version
  spread_cost_formula: >-
    entry_quantity * multiplier * max(0, entry_ask - entry_midpoint) +
    exit_quantity * multiplier * max(0, expected_exit_midpoint - expected_exit_bid)
  slippage_fraction_per_side: 0.001
  slippage_cost_formula: >-
    0.001 * entry_notional_usd + 0.001 * expected_exit_notional_usd
  short_term_tax_fraction: 0.35
  long_term_tax_fraction: 0.15
  tax_cost_formula: >-
    max(0, expected_gross_pnl_usd - spread_cost_usd - slippage_cost_usd) *
    applicable_tax_fraction
  api_cost_formula: actual_model_cost_allocated_to_arm_usd
  net_edge_formula: >-
    expected_gross_pnl_usd - spread_cost_usd - slippage_cost_usd -
    estimated_tax_cost_usd - api_cost_usd
  minimum_net_edge_usd: 0.50
  minimum_expected_net_return_fraction: 0.02
  minimum_edge_to_friction_ratio: 5.0
  baseline_gate_policy:
    applies_to:
      - deterministic_no_ai
      - seeded_random
    bypass_only:
      - minimum_net_edge_usd
      - minimum_expected_net_return_fraction
      - minimum_edge_to_friction_ratio
    still_required:
      - registered_strategy_eligibility_and_invalidation
      - quote_freshness
      - liquidity
      - registered_spread_and_slippage_limits
      - volatility_and_position_caps
      - settled_cash
      - holdings
      - all_breakers_and_global_kill_switch
      - all_other_deterministic_risk_rules
    maximum_median_spread_fraction: 0.003
    invented_strategy_gross_edge_allowed: false
    hypothetical_net_edge_uses_same_formula_and_hypothetical_p: true
  required_baseline_open_test_vector:
    arm: deterministic_no_ai
    prior_resolved_base_rate: '0.50'
    hypothetical_p: '0.50'
    target_gain_usd: '5.00'
    loss_if_wrong_usd: '5.00'
    total_modeled_round_trip_friction_usd: '0.50'
    hypothetical_net_edge_usd_before_tax_and_api_cost: '-0.50'
    median_spread_fraction: '0.001'
    settled_cash_usd: '500.00'
    conservative_entry_notional_plus_friction_usd: '50.50'
    liquidity_passes: true
    all_breakers_clear: true
    all_other_deterministic_risk_rules_pass: true
    expected_result: OPEN_ALLOWED
    assertion: >-
      The position may open despite p = 0.5 and negative hypothetical net edge
      because probability-based net-edge and edge-ratio gates are skipped; every listed
      deterministic gate still passes.
  short_horizon:
    trading_days_below: 5
    allowed_only_for_preregistered_event_strategy: true
    minimum_expected_net_return_fraction: 0.05
    minimum_edge_to_friction_ratio: 10.0
  exits_exempt: true

forecast_targets:
  registry_version: 1
  every_forecast_probability_requires_registered_target_id: true
  target_definition_immutable_after_forecast: true
  resolution_states:
    - SUCCESS
    - FAILURE
    - VOID_DATA
  void_data_policy:
    allowed_only_when_registered_resolution_inputs_cannot_be_recovered: true
    reason_and_missing_fields_required: true
    excluded_from_brier_and_concordance: true
    retained_and_counted_for_data_quality: true
  targets:
    research_sector_alpha:
      target_id_template: research_sector_alpha_{horizon_sessions}d_v1
      forecast_type: RESEARCH_SECTOR_ALPHA
      applies_to_statuses:
        - QUALIFIED
        - REJECTED
        - INSUFFICIENT_EVIDENCE
      permitted_horizon_sessions:
        - 5
        - 10
        - 20
        - 60
      horizon_gate:
        before_50_resolved_research_forecasts: 20
        at_or_after_50_resolved_research_forecasts:
          - 5
          - 10
          - 20
          - 60
      primary_target_id: research_sector_alpha_20d_v1
      start: first_eligible_fresh_midpoint_after_research_timestamp
      resolve: permitted_horizon_session_close
      binary_success_definition: >-
        candidate_total_return_after_modeled_entry_exit_spread_and_slippage
        strictly_exceeds_matched_sector_etf_total_return_after_identical_friction
      benchmark: mapped_select_sector_spdr_etf
    portfolio_selection_success:
      target_id_template: portfolio_selection_success_{horizon_sessions}d_v1
      forecast_type: PORTFOLIO_SELECTION_SUCCESS
      permitted_horizon_sessions:
        - 5
        - 10
        - 20
        - 60
      start: selection_reference_entry
      resolve: earlier_of_registered_exit_or_horizon
      binary_success_definition: >-
        selection_reference_net_pnl_strictly_positive_after_spread_slippage_estimated_tax_and_allocated_api_cost
    critic_selection_failure:
      target_id_template: critic_selection_failure_{portfolio_target_id}_v1
      forecast_type: CRITIC_SELECTION_FAILURE
      applies_to_verdicts:
        - PASS
        - ADVISORY
        - HARD_VETO
      start_and_resolve: corresponding_portfolio_selection_target
      binary_success_definition: corresponding_portfolio_selection_target_fails
      every_critic_verdict_resolves_from_shadow_selection_reference: true
    holding_thesis_survival:
      target_id: holding_thesis_survival_20d_v1
      forecast_type: HOLDING_THESIS_SURVIVAL
      horizon_sessions: 20
      resolve: earlier_of_actual_deterministic_exit_or_horizon
      binary_success_definition: >-
        holding_avoids_deterministic_invalidation_and_beats_mapped_sector_etf_after_modeled_exit_spread
    option_selection_success:
      target_id: option_selection_success_to_exit_or_expiry_v1
      forecast_type: OPTION_SELECTION_SUCCESS
      resolve: earlier_of_registered_exit_or_expiry
      binary_success_definition: >-
        lane_b_selection_reference_net_return_strictly_positive_after_spread_slippage_fees_estimated_tax_and_allocated_api_cost
      exposure_equivalent_underlying_is_separate_comparison: true
  sector_benchmark_mapping:
    universe:
      - XLC
      - XLY
      - XLP
      - XLE
      - XLF
      - XLV
      - XLI
      - XLB
      - XLRE
      - XLK
      - XLU
    missing_or_ambiguous_mapping_action: INSUFFICIENT_EVIDENCE
    vti_substitution_allowed: false
  stored_with_each_forecast:
    - forecast_type
    - target_id
    - target_registry_version
    - benchmark
    - start_timestamp
    - stated_horizon
    - resolution_timestamp_and_rule
    - cost_model
    - eventual_binary_outcome

risk_and_sizing:
  starting_cash_usd_per_lane: 500.00
  target_position_fraction: 0.10
  target_volatility_fraction: 0.20
  realized_volatility_lookback_sessions: 20
  maximum_position_fraction: 0.25
  maximum_open_positions: 5
  maximum_orders_per_day: 5
  daily_loss_fraction: 0.03
  drawdown_buy_block_fraction: 0.10
  drawdown_lock_fraction: 0.15
  maximum_limit_distance_fraction: 0.005
  require_settled_cash_for_buys: true
  unsettled_proceeds_may_fund_buys: false
  volatility_size_formula: >-
    target_position_fraction *
    (target_volatility_fraction / realized_20d_annualized_volatility)
  size_cap_formula: >-
    min(volatility_scaled_size, maximum_position_fraction, settled_cash_capacity,
    liquidity_capacity, lane_capacity)
  earnings_and_filing_size_tilt:
    allowed: true
    minimum_multiplier: 0.00
    maximum_multiplier: 1.00
    may_increase_size: false
    may_improve_rank: false
    may_create_eligibility: false
    may_relax_entry_trigger: false
  automatic_breakers:
    scope:
      - each_lane
      - combined_paper_portfolio
    any_scope_breach_blocks_new_entries_globally: true
    global_kill_switch:
      persistent: true
      startup_state: restore_durable_state
      fail_closed_on_unknown_state: true
      unknown_state: engaged
      operator_controlled: true
      blocks_new_entries: true
      exits_remain_allowed: true
    daily_loss_fraction: 0.03
    daily_reference: prior_market_day_close
    daily_reset: next_market_date
    weekly_loss_fraction: 0.05
    weekly_reference: prior_friday_close
    weekly_reset: next_market_week
    peak_to_trough_drawdown_fraction: 0.10
    peak_to_trough_market_recovery_is_rearm_prerequisite: false
    peak_to_trough_rearm_requires_documented_operator_review: true
    peak_to_trough_rearm_requires_operator_approval: true
    hard_drawdown_lock_fraction: 0.15
    hard_lock_engages_global_kill_switch: true
    hard_lock_rearm_requires_operator_incident_review: true
    measured_after_api_cost: true
    missing_valuation_action: block_new_entries
    exits_and_reductions_always_allowed_up_to_verified_holdings: true

calibration:
  metric: brier_score
  scored_separately_per_agent: true
  include_proposals: true
  include_rejections: true
  include_abstentions: true
  include_critic_objections: true
  minimum_resolved_forecasts: 50
  baseline: prior_resolved_base_rate_same_target
  require_score_strictly_better_than_baseline: true
  below_minimum_label: INSUFFICIENT_SAMPLE
  current_outcome_may_enter_baseline: false
  void_data_excluded_from_brier: true

ai_stop_rule:
  first_evaluation_calendar_days_after_first_official_run: 365
  recheck_frequency_after_first_evaluation: monthly
  evaluation_scope: same_preregistration_series_and_identical_resolved_snapshots
  continuation_gates_all_required:
    agent_arm_after_cost_not_below_no_ai:
      formula: >-
        agent_with_approvals_cumulative_after_cost_return >=
        deterministic_no_ai_cumulative_after_cost_return
    research_rank_superiority:
      method: paired_bootstrap_of_resolved_batch_concordance_differences
      runs: 10000
      sampling_unit: resolved_research_batch
      resampling: paired_batches_with_replacement
      statistic: >-
        mean_research_pairwise_concordance - mean_screener_pairwise_concordance
      success_event: research_pairwise_concordance_strictly_greater_than_screener
      minimum_probability: 0.80
      seed_formula: >-
        sha256(registration_id | "ai-stop-rule" | evaluation_date |
        resolved_batch_content_hash)
      insufficient_resolved_ranking_pairs: gate_failure
  action_when_any_continuation_gate_fails:
    disable_stages:
      - research
      - portfolio
      - critic
    reason: AI_STOP_RULE_TRIGGERED
    deterministic_cycle_continues: true
    persistent: true
    automatic_reenable_allowed: false
  reenable_requires:
    - new_preregistration_version
    - operator_approval
    - new_experiment_segment

shadow_kelly:
  enabled_for_logging_only: true
  execution_connected: false
  minimum_calendar_days: 183
  minimum_completed_round_trip_trades: 30
  minimum_scored_forecasts: 50
  require_brier_better_than_base_rate: true
  require_positive_after_cost_performance: true
  maximum_allowed_drawdown_fraction: 0.10
  kelly_formula: probability_success - ((1 - probability_success) / payoff_ratio)
  payoff_ratio_formula: target_gain_usd / loss_if_wrong_usd
  fractional_kelly_multiplier: 0.25
  logged_size_formula: >-
    min(max(0, 0.25 * raw_kelly), maximum_position_fraction,
    volatility_cap, settled_cash_capacity, liquidity_capacity, lane_capacity)

counterfactual_arms:
  same_snapshot_timestamps_sizing_and_risk_engine: true
  arms:
    - agent_alone
    - agent_with_approvals
    - deterministic_no_ai
    - seeded_random
    - vti
    - cash
    - exposure_matched_vti
    - lane_b_delta_equivalent_underlying
  random_seed_formula: >-
    sha256(registration_id | official_market_date | lane | snapshot_content_hash)
  log_random_seed: true
  baseline_exit_rule:
    applies_to:
      - deterministic_no_ai
      - seeded_random
    exit_at_earliest_of:
      - registered_strategy_invalidation
      - close_of_20th_session_after_entry
    agent_override_allowed: false
    use_same_registered_entry_and_exit_friction_model: true
    apply_exit_spread_slippage_fees_and_estimated_tax: true
  selection_timing_attribution:
    selection_reference:
      create_for_every_portfolio_selection: true
      included_downstream_dispositions:
        - critic_pass
        - critic_hard_veto
        - critic_advisory_dropped
        - trigger_not_fired
        - risk_blocked
      entry_time: first_eligible_fresh_midpoint_after_portfolio_timestamp
      waits_for_code_trigger: false
      size: evaluation_only_theoretical_size
      theoretical_size_formula: >-
        ordinary_volatility_liquidity_and_position_caps_without_critic_trigger_approval_cash_breaker_or_portfolio_admission
      missing_reference_price_or_theoretical_size_deadline: next_session_close
      missing_reference_price_or_theoretical_size_outcome: VOID_DATA
      void_data:
        excluded_from_brier_scoring: true
        excluded_from_concordance_scoring: true
        counted_on_dashboard: true
        reason_code_required: true
        monthly_rate_denominator: >-
          all_selection_reference_records_with_resolution_deadline_in_calendar_month
        page_when_monthly_rate_strictly_exceeds: 0.05
        page_once_on_threshold_crossing_per_calendar_month: true
      isolated_from_official_cards_fills_holdings_cash_and_paper_pnl_scoreboard: true
      writes_official_evaluation_and_critic_calibration_records: true
    code_timed:
      same_candidate_direction_exit_and_sizing_method: true
      waits_for_registered_code_trigger: true
    selection_value_formula: >-
      selection_reference_return - matched_deterministic_or_random_selection_return
    timing_value_formula: code_timed_return - selection_reference_return
    separate_ids_timestamps_prices_trigger_versions_and_costs: true
  lane_b_delta_equivalent_underlying:
    applies_to_every_lane_b_position: true
    signed_virtual_shares_formula: >-
      entry_net_delta * contract_multiplier * contracts
    delta_frozen_at_entry: true
    rebalance_after_entry: false
    entry_and_exit_timestamps: actual_lane_b_code_timed_timestamps
    costs:
      include_underlying_spread: true
      include_registered_slippage: true
      include_estimated_tax: true
      model_api_cost_usd: 0
    reports:
      - dollar_pnl
      - return_normalized_to_lane_b_maximum_loss_capital
    purpose: attribution_benchmark_not_recommendation
  api_cost_attribution:
    agent_alone: actual_allocated_model_cost
    agent_with_approvals: actual_allocated_model_cost
    deterministic_no_ai: 0
    seeded_random: 0
    vti: 0
    cash: 0
    exposure_matched_vti: 0
    lane_b_delta_equivalent_underlying: 0

strategy_evaluation:
  dividend_adjusted_total_return: true
  no_lookahead: true
  walk_forward: true
  required_regime_test_periods:
    - 2008
    - 2020
    - 2022
  report_parameter_variants_tested: true
  include_bid_ask_spreads: true
  include_slippage: true
  include_estimated_taxes: true
  include_settled_cash_rules: true
  benchmark: VTI
  constituent_source_gate:
    required_provider: Norgate Data
