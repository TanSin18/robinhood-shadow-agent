  shared_call_rounding_residual_rule: assign_to_lexicographically_lowest_lane_id
  annual_target_exhausted_action: HOLD_OPERATIONAL
  annual_target_exhausted_reason: ANNUAL_AI_COST_TARGET_EXCEEDED
  recovery_shares_official_ceiling: true
  what_if_run_llm_ceiling: 0.20
  replay_without_new_inference_ceiling: 0.00
  preflight_reserve_mandatory_remainder: true
  pricing_snapshot:
    as_of: '2026-09-28'
    billing: standard_uncached
    input_usd_per_million_tokens:
      gpt-5.4-nano-2026-03-17: 0.20
      gpt-5.4-mini-2026-03-17: 0.75
      gpt-5.4-2026-03-05: 2.50
    output_usd_per_million_tokens:
      gpt-5.4-nano-2026-03-17: 1.25
      gpt-5.4-mini-2026-03-17: 4.50
      gpt-5.4-2026-03-05: 15.00
    reasoning_tokens_are_billed_as_output_tokens: true
    max_output_tokens_includes_reasoning_visible_and_formatting_tokens: true
    sources:
