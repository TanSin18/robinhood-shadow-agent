  ai_ablation_required: true
  ai_variant_must_beat_plain_after_api_cost: true
  single_stock_backtest_scope: current_mega_caps_only
  single_stock_survivorship_bias_label_required: true
  report_actual_history_length_per_ticker: true
  monte_carlo:
    method:
      - block_bootstrap_daily_returns
